<text x="488" y="480" font-family="Georgia,serif" font-size="48" fill="#17364b">80 <tspan font-family="Arial,sans-serif" font-size="18" fill="#71808b">GB / day</tspan></text>
<rect x="488" y="513" width="300" height="9" rx="4.5" fill="#e7ecef"/><rect x="488" y="513" width="93" height="9" rx="4.5" fill="#2c679e"/>
<text x="488" y="551" font-family="Arial,sans-serif" font-size="14" fill="#4d6474">Today: 24.6 GB</text><text x="488" y="599" font-family="Arial,sans-serif" font-size="12" fill="#71808b">Resets at local midnight · History stays</text>
<rect x="887" y="437" width="306" height="118" rx="12" fill="#f4f7f3" stroke="#dce6dc"/>
<circle cx="912" cy="465" r="8" fill="#b47a32"/><text x="931" y="470" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#344b38">Daily usage is near your limit</text>
<text x="908" y="500" font-family="Arial,sans-serif" font-size="14" fill="#576d5b">76 GB used · 4 GB remaining</text>
<text x="908" y="527" font-family="Arial,sans-serif" font-size="12" fill="#738476">Alerts at 80%, 95%, and 100%</text>
<text x="888" y="599" font-family="Arial,sans-serif" font-size="12" fill="#71808b">A reminder, without cutting your connection</text>
<text x="640" y="680" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#617480">Native widget   ·   Optional Codex skill   ·   No external Python required</text>
<text x="1208" y="704" text-anchor="end" font-family="Arial,sans-serif" font-size="10" fill="#87939a">Illustrative UI values</text>
