<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
<title id="title">Traffic Orb: monitor, set a limit, get notified</title><desc id="desc">An illustrated macOS traffic widget and three cards explaining live speeds, a configurable daily limit, and quota alerts. Values are illustrative.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#fcfaf4"/><stop offset="1" stop-color="#edf2f3"/></linearGradient><linearGradient id="orb" x2="1" y2="1"><stop stop-color="#ffffff" stop-opacity=".94"/><stop offset="1" stop-color="#e9f0f3" stop-opacity=".72"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#173249" flood-opacity=".09"/></filter></defs>
<rect width="1280" height="720" rx="26" fill="url(#bg)"/>
<path d="M795-30c170 65 251 10 520 150M-40 660c193-91 303 84 502 16s352-30 475 17" fill="none" stroke="#d9e4e6" stroke-width="2"/>
<path d="M890 0c74 96 202 100 390 92" fill="none" stroke="#e2e8df" stroke-width="48" opacity=".36"/>
<text x="72" y="67" font-family="Arial,sans-serif" font-size="13" letter-spacing="3" fill="#5a6a74">MACOS · V2RAYN · ON YOUR MAC</text>
<text x="67" y="148" font-family="Georgia,serif" font-size="76" font-weight="700" fill="#16324a">Traffic Orb</text>
<text x="72" y="193" font-family="Arial,sans-serif" font-size="26" fill="#405363">Watch your traffic. Keep your day in view.</text>
<rect x="72" y="228" width="143" height="32" rx="16" fill="#e8eef1"/><text x="143" y="249" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#254d6d">LIVE SPEEDS</text>
<rect x="228" y="228" width="159" height="32" rx="16" fill="#f2e8dd"/><text x="307" y="249" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#895031">DAILY LIMITS</text>
<rect x="400" y="228" width="169" height="32" rx="16" fill="#e6eee7"/><text x="485" y="249" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#42634d">LOCAL DATA</text>
<g filter="url(#shadow)"><circle cx="1036" cy="156" r="108" fill="url(#orb)" stroke="#cfdae1" stroke-width="1.5"/></g>
<path d="M1036 48a108 108 0 0 1 101 146" fill="none" stroke="#2c679e" stroke-width="4" stroke-linecap="round"/>
<path d="M938 190q43-13 85 2t112-3" fill="none" stroke="#dbe8ee" stroke-width="15" opacity=".55"/>
<g text-anchor="middle" font-family="Arial,sans-serif"><text x="1036" y="102" font-size="12" fill="#5a6973">TODAY / 80 GB</text><text x="1036" y="142" font-size="24" fill="#a54b1c">↑ 1.8 MiB/s</text><text x="1036" y="179" font-size="24" fill="#225f9a">↓ 4.2 MiB/s</text><text x="1036" y="223" font-size="18" fill="#263f51">24.6 GB</text></g>
<g filter="url(#shadow)" fill="#fffefa" stroke="#e1e4df"><rect x="60" y="328" width="360" height="304" rx="20"/><rect x="460" y="328" width="360" height="304" rx="20"/><rect x="860" y="328" width="360" height="304" rx="20"/></g>
<g font-family="Arial,sans-serif" fill="#17364b"><circle cx="98" cy="328" r="23" fill="#e1eaf0"/><circle cx="498" cy="328" r="23" fill="#f0e5d8"/><circle cx="898" cy="328" r="23" fill="#e3ebe3"/><text x="98" y="334" font-size="15" text-anchor="middle">01</text><text x="498" y="334" font-size="15" text-anchor="middle">02</text><text x="898" y="334" font-size="15" text-anchor="middle">03</text><text x="88" y="380" font-size="21" font-weight="700">MONITOR</text><text x="488" y="380" font-size="21" font-weight="700">SET YOUR LIMIT</text><text x="888" y="380" font-size="21" font-weight="700">GET NOTIFIED</text></g>
<g font-family="Arial,sans-serif" font-size="14" fill="#6a7780"><text x="88" y="405">Upload and download, every second.</text><text x="488" y="405">A daily budget you can change.</text><text x="888" y="405">A clear heads-up before the cap.</text></g>
